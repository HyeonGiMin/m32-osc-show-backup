<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M32 Web Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>M32 Web Server</h1>
    <div id="header-summary">로딩 중...</div>
</header>

<main>
    <!-- Console Management -->
    <section>
        <div class="section-header">
            <span>콘솔 관리</span>
            <button class="btn small" onclick="toggleConsoleForm()">+ 추가</button>
        </div>

        <form id="console-form" class="inline-form" onsubmit="submitConsole(event)">
            <input type="hidden" id="cf-id">
            <div class="form-field">
                <label>이름</label>
                <input type="text" id="cf-name" placeholder="Main Stage" required style="width:140px">
            </div>
            <div class="form-field">
                <label>IP 주소</label>
                <input type="text" id="cf-ip" placeholder="192.168.0.2" required style="width:140px">
            </div>
            <div class="form-field">
                <label>포트</label>
                <input type="number" id="cf-port" value="10023" style="width:80px">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn primary small">저장</button>
                <button type="button" class="btn small" onclick="cancelConsoleForm()">취소</button>
            </div>
        </form>

        <div id="consoles-grid"></div>
    </section>

    <!-- Scene Slot Management -->
    <section>
        <div class="section-header">씬 슬롯 관리</div>
        <div class="section-body">
            <div class="backup-row">
                <select id="backup-console-select" onchange="onBackupConsoleChange()">
                    <option value="">콘솔 선택...</option>
                </select>
            </div>
        </div>
        <div id="slot-picker-wrap">
            <p class="empty-msg" id="slot-picker-empty">콘솔을 선택하면 씬 슬롯이 표시됩니다.</p>
            <table id="slot-picker-table" style="display:none">
                <thead>
                    <tr>
                        <th>슬롯</th>
                        <th>이름</th>
                        <th>마지막 백업</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="slot-picker-body"></tbody>
            </table>
        </div>
    </section>

    <!-- Backup Modal -->
    <div id="backup-modal" class="modal-overlay" style="display:none" onclick="onModalOverlayClick(event)">
        <div class="modal">
            <div class="modal-title">씬 백업 — <span id="bm-slot-label"></span></div>
            <div class="form-field">
                <label>이름</label>
                <input type="text" id="bm-name" placeholder="예: 1부 예배 세팅" style="width:100%">
            </div>
            <div class="form-field" style="margin-top:8px">
                <label>설명</label>
                <input type="text" id="bm-desc" placeholder="선택 입력" style="width:100%">
            </div>
            <div class="form-actions" style="margin-top:12px">
                <button class="btn primary small" onclick="confirmBackup()">백업</button>
                <button class="btn small" onclick="closeBackupModal()">취소</button>
            </div>
        </div>
    </div>

    <!-- Schedules -->
    <section>
        <div class="section-header">
            <span>스케줄 관리</span>
            <button class="btn small" onclick="toggleScheduleForm()">+ 추가</button>
        </div>

        <form id="schedule-form" class="inline-form" onsubmit="submitSchedule(event)">
            <input type="hidden" id="sf-id">
            <div class="form-field">
                <label>이름</label>
                <input type="text" id="sf-name" placeholder="Daily Backup" required style="width:140px">
            </div>
            <div class="form-field">
                <label>콘솔</label>
                <select id="sf-console" required style="min-width:140px"></select>
            </div>
            <div class="form-field">
                <label>색상</label>
                <input type="color" id="sf-color" value="#4a9eff" style="width:48px; height:32px; padding:2px 4px; cursor:pointer;">
            </div>
            <div class="form-field" id="sf-slotrange-wrap">
                <label>슬롯 범위</label>
                <div style="display:flex; gap:6px; align-items:center;">
                    <input type="number" id="sf-slot-start" placeholder="기본" min="0" max="99" style="width:64px">
                    <span style="color:var(--muted); font-size:12px;">~</span>
                    <input type="number" id="sf-slot-end" placeholder="기본" min="0" max="99" style="width:64px">
                </div>
            </div>
            <div class="form-field">
                <label>Cron</label>
                <input type="text" id="sf-cron" placeholder="0 2 * * *" required style="width:130px">
            </div>
            <div class="form-field" style="flex-direction:row; align-items:center; gap:8px; padding-bottom:2px;">
                <input type="checkbox" id="sf-enabled" checked>
                <label for="sf-enabled" style="text-transform:none; font-size:13px;">활성화</label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn primary small">저장</button>
                <button type="button" class="btn small" onclick="cancelScheduleForm()">취소</button>
            </div>
        </form>

        <div id="schedules-wrap">
            <p class="empty-msg" id="empty-schedules" style="display:none">스케줄이 없습니다.</p>
            <table id="schedules-table" style="display:none">
                <thead>
                    <tr>
                        <th>색상</th>
                        <th>이름</th>
                        <th>콘솔</th>
                        <th>슬롯 범위</th>
                        <th>Cron</th>
                        <th>상태</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="schedules-body"></tbody>
            </table>
        </div>
    </section>

    <!-- Settings -->
    <section>
        <div class="section-header">설정</div>
        <div class="section-body">
            <div class="settings-row">
                <div class="form-field">
                    <label>상태 확인 주기</label>
                    <select id="polling-interval-select">
                        <option value="10">10초</option>
                        <option value="30">30초</option>
                        <option value="60">1분 (기본)</option>
                        <option value="120">2분</option>
                        <option value="300">5분</option>
                        <option value="600">10분</option>
                        <option value="1800">30분</option>
                        <option value="0">사용 안함</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>저장 위치</label>
                    <select id="settings-save-location">
                        <option value="local">이 브라우저 (localStorage)</option>
                        <option value="server">서버 기본값 (config.json)</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn primary small" onclick="saveSettings()">저장</button>
                </div>
            </div>
            <p id="settings-status" class="settings-status"></p>
        </div>
    </section>

    <!-- Live Logs -->
    <section>
        <div class="section-header">
            <span>실시간 로그</span>
            <button class="btn small" onclick="clearLogs()">지우기</button>
        </div>
        <div id="log-container"></div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
